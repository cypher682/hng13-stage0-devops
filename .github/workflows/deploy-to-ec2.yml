name: Deploy index.html to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.EC2_HOST }}
      USER: ${{ secrets.EC2_USER }}
      KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Copy index.html
        run: scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa index.html $USER@$HOST:/tmp/index.html

      - name: Deploy to NGINX root
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $USER@$HOST <<'EOF'
            set -e
            sudo apt update -y
            sudo apt install -y nginx
            ROOT=$(awk '/server {/,/}/ {if ($1=="root"){gsub(/;/,"",$2);print $2;exit}}' <(sudo nginx -T 2>/dev/null) || echo /var/www/html)
            sudo mv /tmp/index.html $ROOT/index.html
            sudo systemctl enable nginx
            sudo systemctl restart nginx
          EOF


