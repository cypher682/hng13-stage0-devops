name: Deploy index.html to EC2

on:
  push:
    branches:
      - main  # or your release branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure known_hosts (avoid interactive SSH host check)
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy index.html to EC2 /tmp (scp)
        run: |
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -P 22 index.html ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/index.html

      - name: Install nginx & move file into /var/www/html (remote)
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # become root / install nginx if missing
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y nginx
            fi

            # ensure /var/www/html exists and is writable
            sudo mkdir -p /var/www/html
            sudo chown root:root /var/www/html
            sudo chmod 755 /var/www/html

            # move the deployed file into place (overwrite)
            sudo mv /tmp/index.html /var/www/html/index.html

            # ensure nginx runs and listens on 80
            sudo systemctl enable nginx
            sudo systemctl restart nginx

            # open firewall (ufw) if present
            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow 80/tcp || true
            fi

            # quick health-check output
            echo "NGINX status:"
            sudo systemctl status nginx --no-pager
          EOF

